[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnifetch"
version = "0.1.0"
description = "Centralized resource discovery, management and downloading"
requires-python = ">=3.11"
# Config files use TOML (read via stdlib tomllib) — no YAML dependency,
# which keeps the image slim and avoids native builds on fresh Python versions.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "feedparser>=6.0",
    "curl_cffi>=0.7",       # Chrome TLS fingerprint for CF-protected pages
    "jinja2>=3.1",          # Web UI templates
    "python-multipart>=0.0.9",  # Web UI form actions
    "qrcode>=7.4",          # 115 QR login (terminal)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.40"]  # optional CF backend (vcb crawler)

[tool.setuptools.package-data]
"omnifetch.webui" = ["templates/*.html", "templates/partials/*.html", "static/*"]

[project.scripts]
omnifetch = "omnifetch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
