# OmniFetch 核心设置（复制为 omnifetch.toml 后生效；也可在 Web UI 设置页修改）
# 优先级：默认值 < 本文件 < OMNIFETCH_* 环境变量（旧前缀 OMNFETCH_* 仍兼容）
poll_interval = 30
reaper_stale_minutes = 10
stalled_after_minutes = 15
max_dispatch_per_tick = 10
max_active_downloads = 3
webhook_url = ""
token = ""
# Web UI 登录（对外网/NAS 访问建议开启；留空 ui_password_hash 则不启用登录）
# 生成哈希：omnifetch hash-password  （交互输入，磁盘上只存 scrypt 哈希）
# 也可用环境变量 OMNIFETCH_UI_PASSWORD_HASH，或 OMNIFETCH_UI_PASSWORD（启动时在内存中哈希）
ui_username = "admin"
ui_password_hash = ""
retry_max_retries = 5
retry_base_seconds = 60
retry_max_seconds = 7200
