services:
  omnifetch:
    build: .
    # serve 默认已绑定 0.0.0.0（局域网可访问），这里显式写出；
    # 未配置 OMNIFETCH_TOKEN 或 Web UI 登录密码时，启动日志会给出告警。
    # Dockerfile 只有 CMD（无 ENTRYPOINT），compose 的 command 会覆盖 CMD，
    # 因此这里必须带上可执行文件名 omnifetch，否则会 exec "serve" 失败。
    command: ["omnifetch", "serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - omnifetch-data:/data
      - ./config:/app/config
    environment:
      OMNIFETCH_DB: /data/omnifetch.db
      OMNIFETCH_CONFIG: /app/config
      OMNIFETCH_POLL_INTERVAL: "30"
      # OMNIFETCH_WEBHOOK: "https://your-bot.example.com/webhook"
    restart: unless-stopped

  # Optional download tools, started with: docker compose --profile downloaders up -d
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    profiles: ["downloaders"]
    ports:
      - "8081:8080"
    volumes:
      - ./downloads:/downloads
    environment:
      WEBUI_PORT: "8080"

  aria2:
    image: p3terx/aria2-pro:latest
    profiles: ["downloaders"]
    ports:
      - "6800:6800"
    environment:
      RPC_SECRET: "omnifetch-test"
      RPC_PORT: "6800"
    volumes:
      - ./downloads:/downloads
      - ./aria2-config:/config

volumes:
  omnifetch-data:
